<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>DeepSeek Harness</h1>

      <div class="row">
        <a href="https://vite.dev" target="_blank">
          <img src="/src/assets/vite.svg" class="logo vite" alt="Vite logo" />
        </a>
        <a href="https://tauri.app" target="_blank">
          <img src="/src/assets/tauri.svg" class="logo tauri" alt="Tauri logo" />
        </a>
        <a href="https://www.typescriptlang.org/docs" target="_blank">
          <img src="/src/assets/typescript.svg" class="logo typescript" alt="TypeScript logo" />
        </a>
      </div>

      <p id="status-msg">Checking DSH status…</p>

      <form class="row" id="control-form">
        <button type="button" id="start-btn">Start</button>
        <button type="button" id="stop-btn">Stop</button>
      </form>

      <p id="greet-msg"></p>
    </main>
  </body>
</html>
