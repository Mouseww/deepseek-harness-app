# Build installers. Actions -> desktop -> Run workflow.
# A v* tag also opens a draft GitHub Release.
name: desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-${{github.ref}}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '22'

jobs:
  build:
    name: ${{matrix.name}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            rust_targets: ''
            args: ''
            shell: pwsh
          - name: macos
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            shell: bash
          - name: linux
            os: ubuntu-22.04
            rust_targets: ''
            args: ''
            shell: bash
    runs-on: ${{matrix.os}}
    defaults:
      run:
        shell: ${{matrix.shell}}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{env.PRIMARY_NODE_VERSION}}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets == ''

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets != ''
        with:
          targets: ${{matrix.rust_targets}}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux WebKit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Icons
        run: pnpm icons

      - name: Build installers
        if: ${{!startsWith(github.ref, 'refs/tags/v')}}
        run: pnpm tauri build ${{matrix.args}}

      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        with:
          tauriScript: pnpm tauri
          args: ${{matrix.args}}
          tagName: ${{github.ref_name}}
          releaseName: DSH Desktop ${{github.ref_name}}
          releaseBody: Windows NSIS, macOS universal DMG, and Linux AppImage/deb. DSH core is the official @deepseek-ai/dsh npm package.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{matrix.name}}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/dmg/*
            src-tauri/target/release/bundle/macos/*
            src-tauri/target/release/bundle/appimage/*
            src-tauri/target/release/bundle/deb/*
            src-tauri/target/*/release/bundle/nsis/*
            src-tauri/target/*/release/bundle/msi/*
            src-tauri/target/*/release/bundle/dmg/*
            src-tauri/target/*/release/bundle/macos/*
            src-tauri/target/*/release/bundle/appimage/*
            src-tauri/target/*/release/bundle/deb/*
