# Build installers and publish a GitHub Release (not a draft).
# Tag v* or Actions -> desktop -> Run workflow.
name: desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-${{github.ref}}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '22'

jobs:
  build:
    name: ${{matrix.name}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            rust_targets: ''
            args: ''
            shell: pwsh
          - name: macos
            os: macos-latest
            rust_targets: ''
            args: ''
            shell: bash
          - name: linux
            os: ubuntu-22.04
            rust_targets: ''
            args: --bundles deb
            shell: bash
    runs-on: ${{matrix.os}}
    timeout-minutes: 55
    defaults:
      run:
        shell: ${{matrix.shell}}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{env.PRIMARY_NODE_VERSION}}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets == ''

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets != ''
        with:
          targets: ${{matrix.rust_targets}}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux WebKit
        if: runner.os == 'Linux'
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo killall apt-get apt unattended-upgrade 2>/dev/null || true
          sudo rm -f /var/lib/man-db/auto-update
          wait_lock() {
            for i in $(seq 1 30); do
              if sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; then
                echo "waiting for apt lock ($i)"
                sleep 2
              else
                return 0
              fi
            done
          }
          install_pkgs() {
            wait_lock
            sudo timeout 90 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -y
            wait_lock
            sudo timeout 240 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
              -y --no-install-recommends install \
              libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          }
          for attempt in 1 2 3; do
            echo "apt attempt $attempt"
            if install_pkgs; then
              exit 0
            fi
            echo "apt attempt $attempt failed; resetting dpkg"
            sudo dpkg --configure -a || true
            sleep 5
          done
          exit 1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Icons
        run: pnpm icons

      - name: Bundle Node and DSH
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: pnpm bundle:runtime

      - name: Build installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: pnpm tauri build ${{matrix.args}}

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{matrix.name}}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/appimage/*.AppImage
            src-tauri/target/*/release/bundle/deb/*.deb

  release:
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            ver=$(node -p "require('./package.json').version")
            echo "tag=v${ver}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          set -euo pipefail
          tag="${{steps.meta.outputs.tag}}"
          mapfile -t files < <(find dist -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no installer files under dist/" >&2
            find dist -print >&2 || true
            exit 1
          fi
          printf 'publishing %s\n' "$tag"
          printf '  %s\n' "${files[@]}"
          notes='Fixes authenticated DSH Web sessions after Host restarts or expiry: protected same-origin 401 responses and failed dynamic client-module imports now return the desktop WebView to /login, while cross-origin failures and genuine Host outages are left untouched. Includes regression coverage for Agent preset and plugin-loading recovery. Installers (not the GitHub source zip): Windows NSIS/MSI, macOS DMG, Linux deb. DSH core is the official @deepseek-ai/dsh package from https://github.com/deepseek-ai/deepseek-harness.'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --title "DSH Desktop $tag" --notes "$notes" --latest
          else
            gh release create "$tag" "${files[@]}" --title "DSH Desktop $tag" --notes "$notes" --latest
          fi
