# Build installers and publish a GitHub Release (not a draft).
# Tag v* or Actions -> desktop -> Run workflow.
name: desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-${{github.ref}}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '22'

jobs:
  build:
    name: ${{matrix.name}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            rust_targets: ''
            args: ''
            shell: pwsh
          - name: macos
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            shell: bash
          - name: linux
            os: ubuntu-22.04
            rust_targets: ''
            args: ''
            shell: bash
    runs-on: ${{matrix.os}}
    defaults:
      run:
        shell: ${{matrix.shell}}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{env.PRIMARY_NODE_VERSION}}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets == ''

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets != ''
        with:
          targets: ${{matrix.rust_targets}}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux WebKit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Icons
        run: pnpm icons

      - name: Build installers
        run: pnpm tauri build ${{matrix.args}}

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{matrix.name}}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/dmg/*
            src-tauri/target/release/bundle/macos/*
            src-tauri/target/release/bundle/appimage/*
            src-tauri/target/release/bundle/deb/*
            src-tauri/target/*/release/bundle/nsis/*
            src-tauri/target/*/release/bundle/msi/*
            src-tauri/target/*/release/bundle/dmg/*
            src-tauri/target/*/release/bundle/macos/*
            src-tauri/target/*/release/bundle/appimage/*
            src-tauri/target/*/release/bundle/deb/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            ver=$(node -p "require('./package.json').version")
            echo "tag=v${ver}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{steps.meta.outputs.tag}}
          name: DSH Desktop ${{steps.meta.outputs.tag}}
          draft: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/**
          body: |
            Installers (not the GitHub source zip):
            - Windows: NSIS `.exe` and MSI
            - macOS: universal DMG
            - Linux: AppImage and `.deb`

            DSH core is the official `@deepseek-ai/dsh` npm package from https://github.com/deepseek-ai/deepseek-harness.
